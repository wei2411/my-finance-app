<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101114">
<title>我的財務</title>

<style>
*{box-sizing:border-box}
:root{
 --bg:#f3f4f7;
 --card:rgba(255,255,255,.86);
 --text:#15161a;
 --muted:#858994;
 --line:#e6e7eb;
 --dark:#111216;
 --green:#19a463;
 --red:#e14d5b;
 --gold:#d59b35;
 --blue:#4678e8;
}
body.dark{
 --bg:#101114;
 --card:rgba(29,30,35,.92);
 --text:#f5f5f7;
 --muted:#999ba4;
 --line:#383940;
 --dark:#fff;
}
body{
 margin:0;
 background:
 radial-gradient(circle at 10% 0%,rgba(86,115,255,.18),transparent 30%),
 radial-gradient(circle at 90% 15%,rgba(40,190,140,.14),transparent 28%),
 var(--bg);
 color:var(--text);
 font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Noto Sans TC",sans-serif;
 min-height:100vh;
}
.app{
 max-width:600px;
 margin:auto;
 min-height:100vh;
 padding-bottom:100px;
}
.header{
 padding:26px 20px 20px;
 color:white;
 background:linear-gradient(135deg,#101114,#252830);
 border-radius:0 0 28px 28px;
}
.headerTop{display:flex;justify-content:space-between;align-items:center}
.header small{color:#aeb1ba}
.header h1{font-size:27px;margin:4px 0}
.iconBtn{
 width:42px;height:42px;border:1px solid #ffffff25;
 border-radius:14px;background:#ffffff12;color:white;font-size:20px;
}
.hero{
 margin:14px;
 padding:22px;
 color:white;
 border-radius:25px;
 background:linear-gradient(135deg,#16181e,#30343e);
 box-shadow:0 12px 30px #0002;
}
.heroLabel{font-size:13px;color:#bfc2cb}
.heroMoney{font-size:34px;font-weight:800;margin:5px 0 14px}
.heroRow{display:flex;justify-content:space-between;font-size:13px;color:#c7c9d0}
.progress{height:8px;background:#ffffff18;border-radius:20px;margin:10px 0;overflow:hidden}
.progress i{display:block;height:100%;background:linear-gradient(90deg,#55d49b,#77a2ff);border-radius:20px}
.grid{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:10px;
 padding:0 14px;
}
.card{
 background:var(--card);
 border:1px solid #ffffff40;
 border-radius:19px;
 padding:15px;
 box-shadow:0 6px 20px #00000008;
 backdrop-filter:blur(12px);
}
.label{font-size:12px;color:var(--muted)}
.big{font-size:21px;font-weight:800;margin-top:6px}
.green{color:var(--green)}.red{color:var(--red)}
.section{padding:0 14px}
.sectionTitle{
 display:flex;justify-content:space-between;align-items:center;
 margin:20px 2px 9px;font-size:18px;font-weight:800
}
.item{
 background:var(--card);
 border:1px solid var(--line);
 border-radius:16px;
 padding:12px;
 margin:7px 0;
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:10px;
}
.itemLeft{display:flex;align-items:center;gap:10px}
.itemIcon{
 width:40px;height:40px;border-radius:13px;
 display:flex;align-items:center;justify-content:center;
 background:#f0f1f4;font-size:20px;
}
body.dark .itemIcon{background:#36373e}
.item small{display:block;color:var(--muted);margin-top:3px}
.amount{font-weight:800;white-space:nowrap}
.tabs{
 position:fixed;
 z-index:10;
 bottom:0;left:0;right:0;
 max-width:600px;margin:auto;
 padding:9px 10px calc(9px + env(safe-area-inset-bottom));
 background:rgba(255,255,255,.88);
 backdrop-filter:blur(20px);
 border-top:1px solid var(--line);
 display:grid;grid-template-columns:repeat(5,1fr);
}
body.dark .tabs{background:rgba(20,21,25,.9)}
.tab{
 border:0;background:none;color:var(--muted);
 font-size:11px;padding:6px 2px;
}
.tab span{display:block;font-size:20px;margin-bottom:2px}
.tab.active{color:var(--text);font-weight:800}
.page{display:none}.page.active{display:block}
input,select,button{font:inherit}
input,select{
 width:100%;padding:12px;
 border:1px solid var(--line);
 border-radius:13px;
 background:var(--card);color:var(--text);
 margin:5px 0 10px;
}
button{
 border:0;border-radius:13px;
 padding:11px 14px;
 background:var(--dark);
 color:var(--bg);
 font-weight:750;
}
.secondary{background:#e9eaee;color:#111}
body.dark .secondary{background:#36373e;color:#fff}
.danger{color:var(--red);background:#ffecee}
.full{width:100%}
.formGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fullCol{grid-column:1/-1}
.chart{
 height:190px;
 display:flex;
 align-items:flex-end;
 gap:7px;
 border-bottom:1px solid var(--line);
 padding:10px 3px;
}
.barCol{flex:1;text-align:center;color:var(--muted);font-size:10px}
.barCol i{
 display:block;
 background:linear-gradient(180deg,#789bff,#333b55);
 border-radius:7px 7px 2px 2px;
 min-height:3px;
 margin-bottom:5px;
}
.loanBox{
 background:linear-gradient(135deg,#242832,#111216);
 color:white;
 border-radius:22px;padding:18px;
}
.modal{
 display:none;position:fixed;inset:0;
 background:#0009;z-index:30;
 align-items:flex-end;
}
.sheet{
 width:100%;max-width:600px;margin:auto;
 background:var(--bg);
 color:var(--text);
 border-radius:24px 24px 0 0;
 padding:20px;
 max-height:90vh;overflow:auto;
}
.modalActions{display:flex;gap:8px;margin-top:8px}
.modalActions button{flex:1}
.notice{
 padding:12px;border-radius:14px;
 background:#eef1f7;color:var(--muted);
 font-size:13px;margin-top:10px
}
body.dark .notice{background:#292b31}
.switch{
 display:flex;justify-content:space-between;align-items:center;
 padding:10px 0;
}
.switch input{width:auto;margin:0}
.empty{text-align:center;color:var(--muted);padding:25px}
@media(max-width:380px){
 .grid,.formGrid{grid-template-columns:1fr}
 .fullCol{grid-column:auto}
}
</style>
</head>

<body>

<div class="app">

<header class="header">
 <div class="headerTop">
  <div>
   <small>PERSONAL FINANCE</small>
   <h1>我的財務</h1>
   <small id="monthText"></small>
  </div>
  <button class="iconBtn" onclick="toggleDark()">☾</button>
 </div>
</header>

<div class="page active" id="home">

<div class="hero">
 <div class="heroLabel">本月還能花</div>
 <div class="heroMoney" id="freeMoney">NT$0</div>
 <div class="heroRow">
  <span>生活費預算</span>
  <span id="lifeUsed">NT$0 / NT$10,000</span>
 </div>
 <div class="progress"><i id="lifeBar"></i></div>
 <div class="heroRow">
  <span>預算使用率</span>
  <span id="lifePct">0%</span>
 </div>
</div>

<div class="grid">
 <div class="card">
  <div class="label">💰 本月收入</div>
  <div class="big green" id="income"></div>
 </div>
 <div class="card">
  <div class="label">💸 本月支出</div>
  <div class="big" id="expense"></div>
 </div>
 <div class="card">
  <div class="label">💵 本月結餘</div>
  <div class="big" id="balance"></div>
 </div>
 <div class="card">
  <div class="label">🏦 資產總額</div>
  <div class="big" id="assets"></div>
 </div>
</div>

<div class="section">
 <div class="sectionTitle">🛡️ 緊急預備金</div>
 <div class="card">
  <div class="row">
   <span>目前金額</span>
   <strong id="reserve"></strong>
  </div>
  <div class="progress" style="background:#ddd">
   <i id="reserveBar" style="background:linear-gradient(90deg,#53c98d,#6d9cff)"></i>
  </div>
  <div class="label">建議盡量不要拿來支付日常消費</div>
 </div>

 <div class="sectionTitle">💳 信貸</div>
 <div class="loanBox">
  <div class="heroRow"><span>剩餘本金</span><strong id="loanRemain"></strong></div>
  <div class="progress"><i id="loanBar"></i></div>
  <div class="heroRow">
   <span id="loanProgress"></span>
   <span id="loanPayment"></span>
  </div>
 </div>

 <div class="sectionTitle">
  最近紀錄
  <button class="secondary" onclick="go('record')">查看全部</button>
 </div>
 <div id="recent"></div>
</div>

</div>

<div class="page" id="record">
<div class="section">
 <div class="sectionTitle">📝 新增記帳</div>
 <div class="card">
  <div class="formGrid">
   <div>
    <label>類型</label>
    <select id="type" onchange="updateCats()">
     <option value="expense">支出</option>
     <option value="income">收入</option>
    </select>
   </div>
   <div>
    <label>日期</label>
    <input id="date" type="date">
   </div>
   <div>
    <label>金額</label>
    <input id="amount" type="number" placeholder="0">
   </div>
   <div>
    <label>類別</label>
    <select id="cat"></select>
   </div>
   <div class="fullCol">
    <label>備註</label>
    <input id="note" placeholder="例如：午餐">
   </div>
   <div class="fullCol">
    <button class="full" onclick="addRecord()">＋ 新增紀錄</button>
   </div>
  </div>
 </div>

 <div class="sectionTitle">📒 所有紀錄</div>
 <div id="records"></div>
</div>
</div>

<div class="page" id="loan">
<div class="section">
 <div class="sectionTitle">💳 貸款管理</div>
 <div class="loanBox">
  <div class="row"><span>原始本金</span><strong id="lp"></strong></div>
  <div class="row"><span>年利率</span><strong id="lr"></strong></div>
  <div class="row"><span>期數</span><strong id="lt"></strong></div>
  <div class="row"><span>每月還款</span><strong id="lm"></strong></div>
  <div class="row"><span>已繳期數</span><strong id="lpaid"></strong></div>
  <div class="progress"><i id="lbar"></i></div>
  <div class="heroRow">
   <span id="lpct"></span>
   <span id="lleft"></span>
  </div>
  <div class="row">
   <span>估算剩餘本金</span>
   <strong id="lremain"></strong>
  </div>
 </div>

 <div style="margin-top:10px">
  <button class="full" onclick="editLoan()">⚙️ 修改貸款資料</button>
 </div>

 <div class="notice">
  每次實際繳款後，可以修改「已繳期數」。所有貸款數字都可以自行調整。
 </div>
</div>
</div>

<div class="page" id="stats">
<div class="section">
 <div class="sectionTitle">📊 近六個月支出</div>
 <div class="card">
  <div class="chart" id="chart"></div>
 </div>

 <div class="sectionTitle">🧾 本月支出分類</div>
 <div id="catStats"></div>
</div>
</div>

<div class="page" id="settings">
<div class="section">

<div class="sectionTitle">⚙️ 財務設定</div>

<div class="card">
 <label>每月薪資</label>
 <input id="sSalary" type="number">

 <label>生活費預算</label>
 <input id="sBudget" type="number">

 <label>緊急預備金</label>
 <input id="sReserve" type="number">

 <label>其他現金／存款</label>
 <input id="sCash" type="number">

 <label>其他資產</label>
 <input id="sAsset" type="number">

 <label>其他負債</label>
 <input id="sDebt" type="number">

 <button class="full" onclick="saveSettings()">儲存設定</button>
</div>

<div class="sectionTitle">🏠 固定支出</div>
<div class="card">
 <div id="fixed"></div>
 <button class="secondary full" onclick="addFixed()">＋ 新增固定支出</button>
</div>

<div class="sectionTitle">🎨 外觀</div>
<div class="card">
 <div class="switch">
  <span>🌙 深色模式</span>
  <input type="checkbox" id="darkSwitch" onchange="toggleDark(this.checked)">
 </div>
</div>

</div>
</div>

<nav class="tabs">
 <button class="tab active" onclick="go('home',this)"><span>🏠</span>總覽</button>
 <button class="tab" onclick="go('record',this)"><span>📝</span>記帳</button>
 <button class="tab" onclick="go('loan',this)"><span>💳</span>貸款</button>
 <button class="tab" onclick="go('stats',this)"><span>📊</span>統計</button>
 <button class="tab" onclick="go('settings',this)"><span>⚙️</span>設定</button>
</nav>

</div>

<div class="modal" id="modal">
 <div class="sheet">
  <h2 id="modalTitle"></h2>
  <div id="modalBody"></div>
  <div class="modalActions">
   <button class="secondary" onclick="closeModal()">取消</button>
   <button onclick="saveEdit()">儲存</button>
  </div>
 </div>
</div>

<script>

const KEY="MY_FINANCE_DATA";

let data=JSON.parse(localStorage.getItem(KEY)||"null")||{
 salary:30000,
 budget:10000,
 reserve:110000,
 cash:0,
 asset:0,
 debt:0,
 fixed:[
  {id:"f1",name:"房租＋水電",amount:5000},
  {id:"f2",name:"其他固定費用",amount:8000}
 ],
 loan:{
  principal:160000,
  rate:2.1,
  terms:36,
  payment:4586,
  paid:0
 },
 records:[]
};

let editId=null;
let editMode=null;

function save(){
 localStorage.setItem(KEY,JSON.stringify(data));
}

function money(n){
 return "NT$"+Math.round(Number(n)||0).toLocaleString("zh-TW");
}

function today(){
 return new Date().toISOString().slice(0,10);
}

function monthKey(){
 return today().slice(0,7);
}

document.getElementById("date").value=today();

function go(id,btn){
 document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));
 document.getElementById(id).classList.add("active");

 document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
 if(btn)btn.classList.add("active");
 else{
  document.querySelectorAll(".tab").forEach(x=>{
   if(x.getAttribute("onclick")?.includes("'"+id+"'"))x.classList.add("active");
  });
 }

 render();
}

function updateCats(){
 let income=document.getElementById("type").value==="income";
 let list=income
 ?["薪資","獎金","其他收入"]
 :["飲食","交通","約會","購物","房租／水電","保險","其他"];

 document.getElementById("cat").innerHTML=list.map(x=>`<option>${x}</option>`).join("");
}

updateCats();

function monthRecords(){
 return data.records.filter(x=>x.date.slice(0,7)===monthKey());
}

function fixedTotal(){
 return data.fixed.reduce((s,x)=>s+Number(x.amount),0);
}

function variableExpenses(){
 return monthRecords()
 .filter(x=>x.type==="expense")
 .reduce((s,x)=>s+Number(x.amount),0);
}

function incomeTotal(){
 return data.salary+
 monthRecords()
 .filter(x=>x.type==="income")
 .reduce((s,x)=>s+Number(x.amount),0);
}

function remainingLoan(){
 let l=data.loan;
 let paid=Math.min(Number(l.paid)||0,l.terms);

 if(paid>=l.terms)return 0;

 let r=l.rate/1200;

 if(r===0){
  return l.principal*(l.terms-paid)/l.terms;
 }

 return l.payment*
 (1-Math.pow(1+r,-(l.terms-paid)))/r;
}

function renderHome(){

 let income=incomeTotal();
 let fixed=fixedTotal();
 let variable=variableExpenses();
 let totalExpense=fixed+variable;

 /*
  生活費只計算可變生活支出。
  固定支出與貸款不會吃掉生活費預算。
 */
 let life=monthRecords()
 .filter(x=>x.type==="expense"&&
 ["飲食","交通","約會","購物","其他"].includes(x.cat))
 .reduce((s,x)=>s+Number(x.amount),0);

 let free=data.budget-life;

 document.getElementById("monthText").textContent=
 new Date().toLocaleDateString("zh-TW",{year:"numeric",month:"long"});

 document.getElementById("freeMoney").textContent=money(Math.max(0,free));
 document.getElementById("lifeUsed").textContent=
 money(life)+" / "+money(data.budget);

 let pct=data.budget?Math.min(100,life/data.budget*100):0;

 document.getElementById("lifePct").textContent=Math.round(pct)+"%";
 document.getElementById("lifeBar").style.width=pct+"%";

 document.getElementById("income").textContent=money(income);
 document.getElementById("expense").textContent=money(totalExpense);

 let balance=income-totalExpense-data.loan.payment;

 document.getElementById("balance").textContent=money(balance);
 document.getElementById("balance").className=
 "big "+(balance>=0?"green":"red");

 document.getElementById("assets").textContent=
 money(data.reserve+data.cash+data.asset);

 document.getElementById("reserve").textContent=money(data.reserve);

 let reservePct=Math.min(100,data.reserve/110000*100);
 document.getElementById("reserveBar").style.width=reservePct+"%";

 document.getElementById("loanRemain").textContent=money(remainingLoan());

 let lp=data.loan.terms?
 Math.round(data.loan.paid/data.loan.terms*100):0;

 document.getElementById("loanBar").style.width=lp+"%";
 document.getElementById("loanProgress").textContent=
 data.loan.paid+" / "+data.loan.terms+" 期";

 document.getElementById("loanPayment").textContent=
 "月付 "+money(data.loan.payment);

 let recent=[...data.records].reverse().slice(0,5);

 document.getElementById("recent").innerHTML=
 recent.map(recordHTML).join("")||
 '<div class="empty">目前還沒有記帳紀錄</div>';
}

function icon(cat){
 const icons={
  "飲食":"🍜","交通":"🚗","約會":"❤️","購物":"🛍️",
  "房租／水電":"🏠","保險":"🛡️","薪資":"💰",
  "獎金":"🎁","其他收入":"💵","其他":"📦"
 };
 return icons[cat]||"💰";
}

function recordHTML(x){
 return `
 <div class="item">
  <div class="itemLeft">
   <div class="itemIcon">${icon(x.cat)}</div>
   <div>
    <b>${x.cat}</b>
    <small>${x.date}${x.note?" ・ "+x.note:""}</small>
   </div>
  </div>
  <div>
   <div class="amount ${x.type==="income"?"green":"red"}">
    ${x.type==="income"?"+":"-"}${money(x.amount)}
   </div>
   <div class="actions">
    <button class="secondary" onclick="editRecord('${x.id}')">修改</button>
    <button class="danger" onclick="deleteRecord('${x.id}')">刪除</button>
   </div>
  </div>
 </div>`;
}

function addRecord(){

 let amount=Number(document.getElementById("amount").value);

 if(!amount||amount<0){
  alert("請輸入正確金額");
  return;
 }

 data.records.push({
  id:Date.now().toString(),
  type:document.getElementById("type").value,
  amount:amount,
  date:document.getElementById("date").value||today(),
  cat:document.getElementById("cat").value,
  note:document.getElementById("note").value
 });

 document.getElementById("amount").value="";
 document.getElementById("note").value="";

 render();
}

function renderRecords(){

 let list=[...data.records].reverse();

 document.getElementById("records").innerHTML=
 list.map(recordHTML).join("")||
 '<div class="empty">目前還沒有記帳紀錄</div>';
}

function editRecord(id){

 let x=data.records.find(x=>x.id===id);

 editId=id;
 editMode="record";

 document.getElementById("modalTitle").textContent="📝 修改記帳";

 document.getElementById("modalBody").innerHTML=`
 <label>類型</label>
 <select id="eType">
  <option value="expense">支出</option>
  <option value="income">收入</option>
 </select>

 <label>金額</label>
 <input id="eAmount" type="number" value="${x.amount}">

 <label>日期</label>
 <input id="eDate" type="date" value="${x.date}">

 <label>類別</label>
 <input id="eCat" value="${x.cat}">

 <label>備註</label>
 <input id="eNote" value="${x.note||""}">
 `;

 document.getElementById("eType").value=x.type;
 document.getElementById("modal").style.display="flex";
}

function deleteRecord(id){

 if(confirm("確定要刪除這筆紀錄嗎？")){
  data.records=data.records.filter(x=>x.id!==id);
  render();
 }
}

function editLoan(){

 editMode="loan";

 let l=data.loan;

 document.getElementById("modalTitle").textContent="💳 修改貸款";

 document.getElementById("modalBody").innerHTML=`
 <label>貸款本金</label>
 <input id="ePrincipal" type="number" value="${l.principal}">

 <label>年利率 %</label>
 <input id="eRate" type="number" step="0.01" value="${l.rate}">

 <label>期數</label>
 <input id="eTerms" type="number" value="${l.terms}">

 <label>每月還款</label>
 <input id="ePayment" type="number" value="${l.payment}">

 <label>已繳期數</label>
 <input id="ePaid" type="number" value="${l.paid}">
 `;

 document.getElementById("modal").style.display="flex";
}

function renderLoan(){

 let l=data.loan;

 document.getElementById("lp").textContent=money(l.principal);
 document.getElementById("lr").textContent=l.rate+"%";
 document.getElementById("lt").textContent=l.terms+" 期";
 document.getElementById("lm").textContent=money(l.payment);
 document.getElementById("lpaid").textContent=l.paid+" 期";

 let pct=l.terms?Math.round(l.paid/l.terms*100):0;

 document.getElementById("lbar").style.width=pct+"%";
 document.getElementById("lpct").textContent=pct+"% 已完成";
 document.getElementById("lleft").textContent=
 Math.max(0,l.terms-l.paid)+" 期剩餘";

 document.getElementById("lremain").textContent=
 money(remainingLoan());
}

function renderStats(){

 let arr=[];

 for(let i=5;i>=0;i--){

  let d=new Date();
  d.setDate(1);
  d.setMonth(d.getMonth()-i);

  let key=d.getFullYear()+"-"+
  String(d.getMonth()+1).padStart(2,"0");

  let val=data.records
  .filter(x=>x.type==="expense"&&x.date.slice(0,7)===key)
  .reduce((s,x)=>s+Number(x.amount),0)+fixedTotal();

  arr.push({
   label:(d.getMonth()+1)+"月",
   value:val
  });
 }

 let max=Math.max(1,...arr.map(x=>x.value));

 document.getElementById("chart").innerHTML=
 arr.map(x=>`
 <div class="barCol">
  <div>${Math.round(x.value/1000)}k</div>
  <i style="height:${Math.max(3,x.value/max*145)}px"></i>
  ${x.label}
 </div>
 `).join("");

 let cats={};

 monthRecords()
 .filter(x=>x.type==="expense")
 .forEach(x=>{
  cats[x.cat]=(cats[x.cat]||0)+Number(x.amount);
 });

 document.getElementById("catStats").innerHTML=
 Object.entries(cats)
 .sort((a,b)=>b[1]-a[1])
 .map(x=>`
 <div class="item">
  <div class="itemLeft">
   <div class="itemIcon">${icon(x[0])}</div>
   <b>${x[0]}</b>
  </div>
  <b>${money(x[1])}</b>
 </div>
 `).join("")||
 '<div class="empty">本月尚無支出</div>';
}

function renderSettings(){

 document.getElementById("sSalary").value=data.salary;
 document.getElementById("sBudget").value=data.budget;
 document.getElementById("sReserve").value=data.reserve;
 document.getElementById("sCash").value=data.cash;
 document.getElementById("sAsset").value=data.asset;
 document.getElementById("sDebt").value=data.debt;

 document.getElementById("fixed").innerHTML=
 data.fixed.map(x=>`
 <div class="item">
  <div class="itemLeft">
   <div class="itemIcon">📌</div>
   <div>
    <b>${x.name}</b>
    <small>${money(x.amount)}／月</small>
   </div>
  </div>
  <div class="actions">
   <button class="secondary" onclick="editFixed('${x.id}')">修改</button>
   <button class="danger" onclick="deleteFixed('${x.id}')">刪除</button>
  </div>
 </div>
 `).join("");
}

function saveSettings(){

 data.salary=Number(document.getElementById("sSalary").value)||0;
 data.budget=Number(document.getElementById("sBudget").value)||0;
 data.reserve=Number(document.getElementById("sReserve").value)||0;
 data.cash=Number(document.getElementById("sCash").value)||0;
 data.asset=Number(document.getElementById("sAsset").value)||0;
 data.debt=Number(document.getElementById("sDebt").value)||0;

 render();

 alert("設定已儲存");
}

function addFixed(){

 let x={
  id:Date.now().toString(),
  name:"新固定支出",
  amount:0
 };

 data.fixed.push(x);
 editFixed(x.id);
}

function editFixed(id){

 let x=data.fixed.find(x=>x.id===id);

 editId=id;
 editMode="fixed";

 document.getElementById("modalTitle").textContent="📌 修改固定支出";

 document.getElementById("modalBody").innerHTML=`
 <label>名稱</label>
 <input id="eName" value="${x.name}">

 <label>每月金額</label>
 <input id="eFixedAmount" type="number" value="${x.amount}">
 `;

 document.getElementById("modal").style.display="flex";
}

function deleteFixed(id){

 if(confirm("確定刪除這項固定支出？")){
  data.fixed=data.fixed.filter(x=>x.id!==id);
  render();
 }
}

function saveEdit(){

 if(editMode==="record"){

  let x=data.records.find(x=>x.id===editId);

  x.type=document.getElementById("eType").value;
  x.amount=Number(document.getElementById("eAmount").value)||0;
  x.date=document.getElementById("eDate").value;
  x.cat=document.getElementById("eCat").value;
  x.note=document.getElementById("eNote").value;
 }

 if(editMode==="fixed"){

  let x=data.fixed.find(x=>x.id===editId);

  x.name=document.getElementById("eName").value||"固定支出";
  x.amount=Number(document.getElementById("eFixedAmount").value)||0;
 }

 if(editMode==="loan"){

  data.loan.principal=Number(document.getElementById("ePrincipal").value)||0;
  data.loan.rate=Number(document.getElementById("eRate").value)||0;
  data.loan.terms=Number(document.getElementById("eTerms").value)||1;
  data.loan.payment=Number(document.getElementById("ePayment").value)||0;

  data.loan.paid=Math.min(
   data.loan.terms,
   Math.max(0,Number(document.getElementById("ePaid").value)||0)
  );
 }

 closeModal();
 render();
}

function closeModal(){
 document.getElementById("modal").style.display="none";
}

function toggleDark(force){

 let on=typeof force==="boolean"
 ?force
 :!document.body.classList.contains("dark");

 document.body.classList.toggle("dark",on);

 let sw=document.getElementById("darkSwitch");
 if(sw)sw.checked=on;

 localStorage.setItem("MY_FINANCE_DARK",on?"1":"0");
}

if(localStorage.getItem("MY_FINANCE_DARK")==="1"){
 toggleDark(true);
}

function render(){

 renderHome();
 renderRecords();
 renderLoan();
 renderStats();
 renderSettings();

 save();
}

render();

</script>

</body>
</html>
